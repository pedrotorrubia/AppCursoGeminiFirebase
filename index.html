<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recrutamento & Seleção | Portal de Vagas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-glow"></div>

    <main class="wrapper">
        <section class="card-container">
            <header class="card-header">
                <h1>Processo Seletivo</h1>
                <p>Preencha os dados abaixo para verificar sua elegibilidade para a vaga.</p>
            </header>

            <form id="vagaForm" autocomplete="off">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Ex: Lucas Silva">
                </div>

                <div class="input-group">
                    <label for="idade">Idade</label>
                    <input type="number" id="idade" required min="0" placeholder="Ex: 22">
                </div>

                <div class="input-group">
                    <label for="altura">Altura (metros)</label>
                    <input type="number" id="altura" required step="0.01" min="0" placeholder="Ex: 1.75">
                </div>

                <button type="submit" class="btn-submit">Verificar Requisitos</button>
            </form>
        </section>
    </main>

    <!-- Modal / Popup Personalizado -->
    <div id="modalResultado" class="modal-overlay hidden">
        <div class="modal-box">
            <div id="modalIcon" class="modal-icon"></div>
            <h2 id="modalTitle">Resultado</h2>
            <p id="modalMessage"></p>
            <button id="modalCloseBtn" class="btn-modal">Ok</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
